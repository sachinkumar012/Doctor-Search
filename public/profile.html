<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile - DocSearch</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }

        .profile-header-card {
            background: var(--white);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 32px;
            margin-bottom: 32px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            object-fit: cover;
        }

        .about-section {
            background: var(--white);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--border-color);
            margin-bottom: 32px;
        }

        .booking-card {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 100px;
            box-shadow: var(--shadow-lg);
        }

        .booking-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: var(--font-body);
        }

        .success-message {
            display: none;
            background-color: #DCFCE7;
            color: #166534;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            margin-top: 16px;
        }

        @media (max-width: 768px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }

            .profile-header-card {
                flex-direction: column;
                text-align: center;
            }

            .profile-img {
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-user-doctor"></i> DocSearch
            </a>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="#" class="nav-link">Find Doctors</a>
            </nav>
        </div>
    </header>

    <main class="main-section">
        <div class="container profile-layout">

            <!-- Left Column: Details -->
            <div id="doctorDetails">
                <div class="profile-header-card">
                    <!-- Injected via JS -->
                    <p>Loading profile...</p>
                </div>
            </div>

            <!-- Right Column: Booking -->
            <aside>
                <div class="booking-card">
                    <h3>Book Appointment</h3>
                    <p style="color: var(--text-gray); margin-bottom: 24px;">Fill out the form below to schedule.</p>

                    <form id="bookingForm" class="booking-form">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="patientName" class="form-control" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="patientPhone" class="form-control" required
                                placeholder="+91 98765 43210">
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="appointmentDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Time</label>
                            <select id="appointmentTime" class="form-control" required>
                                <option value="">Select Time</option>
                                <option value="10:00 AM">10:00 AM</option>
                                <option value="11:00 AM">11:00 AM</option>
                                <option value="02:00 PM">02:00 PM</option>
                                <option value="04:00 PM">04:00 PM</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Confirm Booking</button>
                    </form>

                    <div id="bookingSuccess" class="success-message">
                        <i class="fa-solid fa-check-circle"></i>
                        Booking Confirmed! We will contact you shortly.
                    </div>
                </div>
            </aside>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const doctorId = params.get('id');

            if (!doctorId) {
                window.location.href = 'index.html';
                return;
            }

            // Fetch Doctor Details
            try {
                const res = await fetch(`/api/doctors/${doctorId}`);
                const doctor = await res.json();

                // Render Profile
                const detailsContainer = document.getElementById('doctorDetails');
                detailsContainer.innerHTML = `
                    <div class="profile-header-card">
                        <img src="${doctor.image}" alt="${doctor.name}" class="profile-img">
                        <div style="flex: 1;">
                            <h1 style="margin-bottom: 8px;">${doctor.name}</h1>
                            <p style="color: var(--primary-blue); font-weight: 500; font-size: 18px; margin-bottom: 16px;">
                                ${doctor.specialization}
                            </p>
                            <div class="doc-rating" style="margin-bottom: 16px;">
                                <i class="fa-solid fa-star"></i> ${doctor.rating} Rating
                            </div>
                            <div class="doc-info">
                                <span class="info-item"><i class="fa-solid fa-briefcase-medical"></i> ${doctor.experience} Experience</span>
                                <span class="info-item"><i class="fa-solid fa-location-dot"></i> ${doctor.location}</span>
                                <span class="info-item"><i class="fa-solid fa-hospital"></i> ${doctor.hospital}</span>
                                <span class="info-item"><i class="fa-solid fa-wallet"></i> ₹${doctor.fee} Consultation Fee</span>
                            </div>
                        </div>
                    </div>

                    <div class="about-section">
                        <h3>About Doctor</h3>
                        <p style="color: var(--text-gray); margin-top: 16px; line-height: 1.6;">
                            ${doctor.about || "No description available."}
                        </p>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                document.getElementById('doctorDetails').innerHTML = "<p>Error loading profile.</p>";
            }

            // Handle Booking
            const form = document.getElementById('bookingForm');
            const successMsg = document.getElementById('bookingSuccess');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const bookingData = {
                    doctorId,
                    patientName: document.getElementById('patientName').value,
                    patientPhone: document.getElementById('patientPhone').value,
                    date: document.getElementById('appointmentDate').value,
                    time: document.getElementById('appointmentTime').value
                };

                try {
                    const res = await fetch('/api/appointments', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bookingData)
                    });

                    if (res.ok) {
                        form.style.display = 'none';
                        successMsg.style.display = 'block';
                    } else {
                        alert("Booking failed. Please try again.");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Error submitting booking.");
                }
            });
        });
    </script>
</body>

</html>
